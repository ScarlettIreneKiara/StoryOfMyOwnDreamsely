    html: `
      <p>My mom is Selene Celeste. The most powerful being that has ever existed — not that she'd ever put it that way herself. She hates when I say it like that, actually. She always says power isn't the point. I've never really understood what she means by that, not until much later. But I'm getting ahead of myself.</p>
      <p>I'm her daughter. Her only one. Iris Celeste. She's told me, in every version of forever we've lived through, that I'm the love of her life. I believe her. I've never had a reason not to.</p>
      <p>She made half the universe before she made me. Stars first, she told me once, then the spaces between them, then the rules that hold it all together — gravity, time, the way light bends around the edges of things. We live in a place with no walls and no clock on it. No sky, either, not really, just a kind of soft dark that goes on forever in every direction. We just call it home, or sometimes the Timeless place, when we're being fancy about it. She runs the whole show from there.</p>
      <p>I used to sit next to her while she worked. Just floating there, chin on my knees, watching her hands move through light like it was water. That's where everything happens — where universes get born, where they get to live for a while, and where, eventually, they end. She did it the way some moms fold laundry. Like it was nothing. Like it was everything. Sometimes she'd hum while she worked, some tune I never learned the name of, and a whole galaxy would spiral out from between her fingers like smoke from a candle.</p>
      <p>"Doesn't it ever wear you out?" I asked her once. I remember a star was dying between her fingers, going dim like a light bulb flickering before it gives out for good. I remember reaching out to touch the light, just to see what a dying star felt like.</p>
      <p>She let me. Of course she let me — nothing in any universe has ever been able to so much as scratch either of us. I felt it fizzle against my palm, warm and strange, like static.</p>
      <p>"Doesn't it?" I asked again.</p>
      <p>She didn't even look up. "Wearing out means there's an end coming, little Iris. I don't have one." Then she touched my forehead, soft, the way she always did. "But I never get tired of you. So maybe that's my answer."</p>
      <p>I remember laughing at that. She called me little Iris when she was being sweet, and just Ris when she was in a hurry, and my rainbow girl on the rare nights she felt like telling stories — something about how, in one of the old, small worlds below us, an iris used to mean a messenger, a bridge between one place and another. "That's you," she told me once. "You're my little bridge. Wherever I go, you go. Doesn't matter which world."</p>
      <p>I remember thinking I'd have a thousand more nights like that one. I didn't know yet how wrong I'd turn out to be.</p>
      <p>Past our home, one step down from it, she's also queen over two planets — twins, and the biggest ones out there by far. You could lose a hundred Earths inside either one and never notice the difference. Esseles and Exegol.</p>
      <p>Esseles is the nice one. Warm. Golden fields that go on for miles, calm oceans the color of glass, mountains that catch the light funny at dusk and turn the whole sky pink and gold at once. The cities there are built up and around these massive towers — observatories, basically, except instead of looking at stars, the people inside them look at universes. Whole ones. Watching is the entire job. The only job, really. People spend their whole lives up in those towers, taking shifts, passing the work down to their kids, generation after generation, just — paying attention. Not to mess with anything. Not to fix it or steer it. Just to see it.</p>
      <p>Because it turns out, if nobody's watching a universe, it starts to come apart. Slowly at first — a little dimmer, a little thinner, like a photograph left out in the sun too long. Then all at once, and then it's just gone, like it was never there to begin with. They've got a saying on Esseles, and my mom used to say it to me like a lullaby: watching keeps things alive. Being remembered is the same as existing.</p>
      <p>I liked Esseles. I liked the way it smelled — I know that sounds strange for a whole planet to have a smell, but it did, something like rain on warm stone.</p>
      <p>Exegol is the opposite in every way that matters. Dry, cracked ground stretching out flat and endless, storms that never really stop rolling across the horizon, lightning flashing behind the clouds like something enormous breathing under there. There used to be a whole fleet buried under the surface — hidden away in shipyards carved out of rock, waiting. While Esseles remembers things, Exegol gets ready. Gets ready for what, I never really asked. Not because I was scared to know — nothing there could touch us any more than the dying star could — just because it never seemed important yet.</p>
      <p>I grew up knowing all of this the same way you know your own street, your own room, the creak in the third stair. It wasn't special. It was just life.</p>
      <p>That night — if you can even call it night when there's no sun to set — we fell asleep in our room, my mom's arms wrapped around me like always, her chin resting on the top of my head. "Goodnight, little Iris," she said, the way she said it every night, like it was a promise instead of a habit. I remember the quiet. I remember nothing in all of existence being able to reach us there. Nothing ever had. Nothing ever could.</p>
      <p>When she woke up, she was a baby.</p>
      <p>Not where we live. Somewhere else completely — a tiny, spinning little dimension called Earth, more fragile than anything I'd ever seen her hold. Her whole huge, impossible self, folded down and squeezed into something small and soft, something with a heartbeat you could actually hear if you pressed your ear to it. And me? I was tucked inside her, curled up small too, waiting. Like she was pregnant with me, except I'd already existed for longer than that entire little world had.</p>
      <p>Some part of her still knew, though. Still felt her real body, asleep back home, waiting for her to come back to it. A thread, thin as spider silk, stretched all the way across the space between who she really was and who she was about to become.</p>
      <p>It happened because two people wished for it. Ethan and Elena Ashford — rich, the kind of rich that gets your name in newspapers, the kind of rich that buys buildings — out in Washington. They already had a son, James. Two years older, dark-haired, the kind of kid who'd grow up polite and a little too serious. My uncle, technically. Though he had no idea. Neither did she, not really, not anymore.</p>
      <p>Because her memory — of me, of home, of everything she used to be — got buried. Almost all of it. Pushed down so deep and so hard it was like it had never happened at all, the way you shove a box in the back of a closet and eventually forget you own it.</p>
      <p>Almost all of it.</p>
      <p>Because even as a newborn, even wrapped up in some scratchy hospital blanket under fluorescent lights in a world way too small and way too loud for her, she felt it. That ache, small and constant, tucked somewhere under her ribs. Missing someone. Someone she couldn't put a name to, couldn't picture, couldn't even really remember losing.</p>
      <p>She just didn't know yet. That someone was Iris.</p>
      <p>And somewhere, back home, in a bed that was suddenly half-empty, I was already starting to miss her too.</p>
    `

      <p>Mom used to tell me this story all the time — about her life here, before me. About the family she had before she became my family. I think she liked telling it. I think some small part of her, even with her memory buried the way it was, needed to.</p>
      <p>She was the baby of the family. The only daughter. Grandpa and Grandma doted on her like she was made of something rarer than gold — which, I guess, in a way, she was.</p>
      <p>My grandpa — Ethan Ashford — is a business tycoon. He runs Ashford Defense, one of the biggest names in the industry. My grandma — Elena Ashford — is a well-known actress and singer, and on top of that, she has a PhD in medicine, which always struck me as a strange combination until I actually met her and realized of course she does everything.</p>
      <p>They wanted a daughter for years. A little girl who'd grow up looking like the two of them mixed together. They had my uncle James first, when Grandma was twenty-three. Then three years of trying, hoping, waiting — until finally, at twenty-six, she got pregnant with my mom.</p>
      <p>They were so happy they gave the entire company a bonus. Fifteen days of paid leave, company-wide, the same day they confirmed it at the eight-week checkup. Grandpa apparently walked out of that appointment and just started calling department heads.</p>
      <p>James, who was three at the time, was deeply confused by the whole thing. He marched up to Grandma with his arms crossed and asked how exactly there was a baby in her stomach — and then, very seriously, accused her of having eaten one alive.</p>
      <p>"That's not quite how it works, sweetheart," she told him, laughing so hard she had to sit down.</p>
      <p>The first three months, Grandpa treated her like she was made of glass. He baby-proofed the entire house before she'd even hit her second trimester. She had morning sickness bad enough that some days she could barely get out of bed, and still she went to work, still he watched her like a hawk the whole time, one eye always on her, one eye always on the baby that wasn't even showing yet.</p>
      <p>As the months went on, her belly grew right along with the due date creeping closer. She wrapped every film project she could as fast as possible, clearing her schedule, trading work for rest, because she knew — she always knew — that the last stretch would need all of her.</p>
      <p>She went into labor early. Grandpa was in the middle of a board meeting when the call came. He didn't even finish the sentence he was on — just grabbed his coat, swung by James's kindergarten to pick him up, and drove straight to the ER, breaking probably every speed law Washington had.</p>
      <p>Ten hours later, on August 28th, 2004, my mom was born.</p>
      <p>The nurses took her off to be cleaned up and checked over in the observation room. Healthy. Perfectly healthy. And almost immediately, something strange happened to Grandma — her skin cleared up, color came back into her face, and for weeks afterward people kept telling her she looked younger, somehow, like carrying my mom had left something behind in her blood. Some kind of residue. None of them understood it then. None of them ever really would.</p>
      <p>After the observation, they finally let Grandma hold her. She pressed a kiss to my mom's forehead and whispered, so soft it was almost just breath: "Welcome to the family, Selene. Selene Ashford."</p>
      <p>Grandpa came in right after. He kissed both their foreheads and cried — really cried, the kind of crying big tough businessmen pretend they don't do — and James trailed in behind him, small hand wrapped around his dad's fingers, looking up at the bundle in Grandma's arms.</p>
      <p>"Mom," he said, "is she my sister?" Grandma smiled at him. "She's your cute little sister. The one you always asked for."</p>
      <p>He didn't say anything else. Just stared at her like she was the most interesting thing he'd ever seen, which, to a three-year-old, she probably was.</p>
      <p>That first night, Grandma nursed the five-hour-old baby, fed her, rocked her until she finally settled into sleep against her chest. They stayed in the hospital for a few more days for observation. Grandpa split his time running back and forth between the office and the hospital room, and both sides of the family started showing up to meet the newest Ashford.</p>
      <p>Grandma's side was the Everglades — Robert and Rose Everglade, who owned Everglade Corporation, a media and entertainment empire that seemed to touch every screen in the country. Grandma had an older brother too, Sebastian Everglade, the CEO, married to Lily, whose own family ran a regional media company. They had a five-year-old son, Oliver.</p>
      <p>Grandpa's side was quieter but no less established. His parents, Henry and Elise Ashford, both retired by then, and his older sister Jasmine — the current COO of Ashford Industries — married to her college sweetheart, Harrington Cole. They had a four-year-old daughter, Charlotte.</p>
      <p>When Grandma and Mom finally came home from the hospital, the family threw a welcome party in the backyard. Nothing extravagant — no press, no formalities, none of the usual weight that came with being who they were. Just family, glasses clinking, everyone allowed to just be people for one afternoon instead of names on a masthead.</p>
      <p>The cousins swarmed Grandma almost immediately — Oliver first, then little Charlotte trailing behind him. "Auntie, show us the baby!" they kept saying, tugging at her sleeve, and she crouched down low enough for them to see.</p>
      <p>They took turns holding her, so carefully, so stiff with the fear of dropping something so small — none of them had ever held a baby that tiny before, not among their own little cluster of almost-same-age kids. Somebody's grip would go too loose and an adult hand would swoop in immediately to steady things, and everyone would laugh, and the baby would sleep right through all of it, unbothered.</p>
      <p>By the time the party wound down, Grandma carried her back inside and lay down beside her in bed, exhausted in the good way. She wrapped her hand loosely around my mom's tiny fingers and just watched her breathe for a while before finally letting her own eyes close.</p>
      <p>None of them knew yet what she really was. Not one of them.</p>
      <p>But she was theirs. And for a while — for a good long while — that was enough.</p>
    `

      <p>As the months rolled by, Mom hit her first birthday, and Grandma and Grandpa turned it into a full gala — the kind of thing that gets written up in a society column instead of just remembered by the people who were there. Relatives, board members, press, half of Seattle's business elite, all crammed into one backyard turned event space to meet the newest Ashford.</p>
      <p>They sat her down in front of a small chocolate cake and let her smash her fists into it while everyone cheered and cameras flashed. Somewhere in the middle of Grandma's speech — baby balanced on her hip, microphone in the other hand — Mom said her first word.</p>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({fs:1.2,lh:1.9,font:'serif',theme:'nebula'},store.get('lb-set',{}));
const P=store.get('lb-pos',{i:0,r:0}),READ=new Set(store.get('lb-read',[]));
const words=h=>h.replace(/<[^>]+>/g,' ').trim().split(/\s+/).length,mins=n=>Math.max(1,Math.round(n/230));
const numeral=t=>{const m=t.match(/Negative (\d+)/);if(m)return '\u2212'+m[1];const p=t.match(/Chapter (\d+)/);return p?p[1]:'\u2726'};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),topOf=e=>e.getBoundingClientRect().top+scrollY;

chapters.forEach((c,i)=>{
  c.w=words(c.html);
  const s=document.createElement('section');s.className='chapter';s.id='ch-'+i;
  s.innerHTML=`<header class="opener"><div class="idx" aria-hidden="true">${numeral(c.title)}</div><h2>${c.title}</h2></header><div class="body">${c.html}</div>`;
  $('#chapters').appendChild(s);
  const b=document.createElement('button');b.className='ti';b.dataset.i=i;
  b.innerHTML=`<span class="n">${numeral(c.title)}</span><span>${c.title}</span><span class="ck"></span>`;
  b.onclick=()=>{go(i);closeAll()};$('#toc').appendChild(b);
  const ci=document.createElement('button');ci.className='ci';
  ci.innerHTML=`<span class="k">${String(i+1).padStart(2,'0')}</span><span>${c.title}</span>`;
  ci.onclick=()=>go(i);$('#ctoc').appendChild(ci);
});
const els=$$('.chapter'),total=chapters.reduce((a,c)=>a+c.w,0);
$('#stats').textContent=`${chapters.length} CHAPTERS`;

function go(i,r=0,smooth=true){const e=els[i];if(e)scrollTo({top:topOf(e)+e.offsetHeight*r,behavior:smooth?'smooth':'auto'})}
function cur(){const y=scrollY+innerHeight*.35;let k=-1;els.forEach((e,i)=>{if(topOf(e)<=y)k=i});return k}
function rat(k){const e=els[k];return clamp((scrollY+innerHeight*.35-topOf(e))/e.offsetHeight)}

// settings
function apply(){const r=document.documentElement;
  r.style.setProperty('--fs',S.fs+'rem');r.style.setProperty('--lh',S.lh);
  r.style.setProperty('--body',S.font==='sans'?"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif":"'EB Garamond',Georgia,serif");
  r.dataset.theme=S.theme;
  $$('[data-k]').forEach(b=>b.classList.toggle('on',String(S[b.dataset.k])===b.dataset.v));
  store.set('lb-set',S)}
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const k=cur(),r=k<0?0:rat(k);
  if(b.dataset.k)S[b.dataset.k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  else if(b.id==='sm')S.fs=Math.max(1,+(S.fs-.08).toFixed(2));
  else if(b.id==='lg')S.fs=Math.min(1.7,+(S.fs+.08).toFixed(2));
  apply();if(k>=0)go(k,r,false)});
apply();

// panels
const drawer=$('#drawer'),scrim=$('#scrim'),sheet=$('#sheet');
function closeAll(){drawer.classList.remove('on');sheet.classList.remove('on');scrim.classList.remove('on')}
$('#menu').onclick=()=>{sheet.classList.remove('on');drawer.classList.add('on');scrim.classList.add('on')};
$('#aa').onclick=()=>{drawer.classList.remove('on');scrim.classList.remove('on');sheet.classList.toggle('on')};
scrim.onclick=closeAll;
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#fab').onclick=()=>document.body.classList.toggle('focus');
$('#begin').onclick=()=>go(0);
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
if(P.i>0||P.r>.03){const c=$('#cont');c.hidden=false;
  c.textContent=`Continue \u00b7 ${chapters[P.i].title} \u00b7 ${Math.round(P.r*100)}%`;
  c.onclick=()=>go(P.i,P.r)}

// chapter openers fade in
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
$$('.opener').forEach(o=>io.observe(o));

// progress, current chapter, saved position
let tick=false,saveT;
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  $('#fill').style.width=(max>0?scrollY/max*100:0)+'%';
  const k=cur(),tt=$('#ttl');
  if(k<0)tt.textContent='Little Bridge';
  else{const r=rat(k);tt.innerHTML=`${chapters[k].title}<small>${Math.round(r*100)}%</small>`;
    $$('.ti').forEach(b=>b.classList.toggle('cur',+b.dataset.i===k));
    if(r>.95&&!READ.has(k)){READ.add(k);store.set('lb-read',[...READ]);$$('.ti')[k].classList.add('done')}
    clearTimeout(saveT);saveT=setTimeout(()=>store.set('lb-pos',{i:k,r:+r.toFixed(3)}),400)}
  tick=false}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
READ.forEach(k=>$$('.ti')[k]&&$$('.ti')[k].classList.add('done'));
onScroll();

// infinite universe: parallax stars + drifting galaxies + black hole
const cv=$('#sky'),g=cv.getContext('2d'),bh=$('#bh'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,stars=[],gals=[];
function size(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.round(W*H/2400)},()=>({x:Math.random()*W,y:Math.random()*H,z:[.15,.4,.8][Math.random()*3|0],r:Math.random()*1.3+.4,p:Math.random()*6.28,h:[270,200,320,45][Math.random()*4|0]}));
  gals=Array.from({length:10},()=>({x:Math.random()*W,y:Math.random()*H*1.6,z:.08+Math.random()*.2,s:22+Math.random()*55,a:Math.random()*3.14,h:[265,285,315,215][Math.random()*4|0]}))}
function draw(t){
  if(document.documentElement.dataset.theme==='paper')return;
  g.clearRect(0,0,W,H);const sy=scrollY,R=H*1.6;
  gals.forEach(o=>{const y=((o.y-sy*o.z)%R+R)%R-H*.3;g.save();g.translate(o.x,y);g.rotate(o.a);g.scale(1,.38);
    const gr=g.createRadialGradient(0,0,0,0,0,o.s);gr.addColorStop(0,`hsla(${o.h},80%,78%,.6)`);gr.addColorStop(.35,`hsla(${o.h},70%,55%,.22)`);gr.addColorStop(1,'transparent');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,o.s,0,6.283);g.fill();g.restore()});
  stars.forEach(s=>{const y=((s.y-sy*s.z*.5)%H+H)%H,a=.35+.65*Math.abs(Math.sin(t/1400*s.z+s.p));
    g.fillStyle=`hsla(${s.h},70%,88%,${a*(.4+s.z*.6)})`;g.fillRect(s.x,y,s.r,s.r)});
  bh.style.transform=`translateY(${Math.sin(sy/1200)*70}px)`}
function loop(t){draw(t);if(!rm)requestAnimationFrame(loop)}
size();addEventListener('resize',()=>{size();draw(0)});
if(rm)addEventListener('scroll',()=>draw(0),{passive:true});
loop(0);
</script>
